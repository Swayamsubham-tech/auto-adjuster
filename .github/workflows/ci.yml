name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install lightweight dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest numpy opencv-python-headless imagehash tqdm pillow

      - name: Lint (flake8)
        run: flake8 src tests --max-line-length=100 --extend-ignore=E203

      - name: Check formatting (black)
        run: black --check src tests

      - name: Run unit tests
        run: pytest tests -v
